<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pocket Mirror ✨</title>


  <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

  
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="container">
    <h1 class="title">Lilac Lucid💗</h1>

    <div class="mirror-frame">
      <div class="mirror-glass" id="mirror">
        <p class="affirmation-text" id="affirmationText">Click to reveal a soft truth 💬</p>
      </div>
    </div>

    <div class="controls">
      <button id="addAffirmationBtn">+ Add My Own</button>
      <button id="themeToggleBtn">🌙 Theme</button>
    </div>

    <div class="footer-note">
      <p>Built with love & softness💗</p>
    </div>
  </div>


  <script src="index.js"></script>
</body>
</html>
